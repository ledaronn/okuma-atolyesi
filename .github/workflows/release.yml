name: release

# Surum etiketi (v1.0.0 gibi) gonderilince: temiz bir Windows makinesinde exe +
# kurulum programi uretilir, paketlenmis exe ile dogrulanir (packaging/build.py)
# ve GitHub Releases'a SHA256 ozetiyle yuklenir. Exe gelistiricinin
# bilgisayarinda derlenmez: kullanici klasoru yollari pakete gomulmesin.
# Elle calistirilinca (Run workflow) yalnizca derler, artifact birakir.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Etiket ile surum ayni mi
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          surum=$(python -c "from surum import SURUM; print(SURUM)")
          if [ "v$surum" != "${GITHUB_REF_NAME}" ]; then
            echo "Etiket ${GITHUB_REF_NAME}, surum.py SURUM $surum: once surumu guncelle."; exit 1; fi

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Paketle, dogrula, kurulum programi
        run: python packaging/build.py --kurulum

      - name: SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist\OkumaAtolyesi-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OkumaAtolyesi-Setup
          path: |
            dist/OkumaAtolyesi-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Okuma Atölyesi ${{ github.ref_name }}
          body_path: packaging/SURUM_NOTU.md
          files: |
            dist/OkumaAtolyesi-Setup-*.exe
            dist/SHA256SUMS.txt
